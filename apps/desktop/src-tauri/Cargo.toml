[package]
name = "couple-os"
version = "0.1.0"
description = "Couple OS — private digital home for two"
edition = "2021"
rust-version = "1.77"

[lib]
name = "couple_os_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
