# Production-like stack (PostgreSQL). Dev به‌صورت پیش‌فرض از SQLite استفاده می‌کند.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: couple
      POSTGRES_PASSWORD: change-me-in-real-env
      POSTGRES_DB: coupleos
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U couple"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  pgdata:
