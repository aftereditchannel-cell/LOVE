# ─────────────────────────────────────────────────────────────
#  GitHub Actions — Build APK
#  Repo  : aftereditchannel-cell/LOVE
#  Branch: arena/01a02144-love
#  Stack : Kotlin 1.9 · AGP 8.5 · Gradle 8.7 · Compose · Hilt · Room
# ─────────────────────────────────────────────────────────────
name: "🔨 Build APK"

on:
  push:
    branches:
      - "arena/01a02144-love"
      - "main"
  pull_request:
    branches:
      - "main"
  workflow_dispatch:
    inputs:
      build_type:
        description: "نوع بیلد"
        required: true
        default: "debug"
        type: choice
        options:
          - debug
          - release

permissions:
  contents: read

jobs:
  # ═══════════════════════════════════════════════════════════
  #   DEBUG APK
  # ═══════════════════════════════════════════════════════════
  build-debug:
    name: "🐛 Debug APK"
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'pull_request' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.build_type == 'debug')

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      # ── اندروید پروژه تو پوشه android/ هست ────────────────
      - name: Build Debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: CoupleOS-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 14

  # ═══════════════════════════════════════════════════════════
  #   SIGNED RELEASE APK  (workflow_dispatch only)
  # ═══════════════════════════════════════════════════════════
  build-release:
    name: "🚀 Signed Release APK"
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.event.inputs.build_type == 'release'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Decode Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/release.keystore

      - name: Create keystore.properties
        run: |
          cat > android/keystore.properties <<EOF
          storeFile=release.keystore
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          EOF

      - name: Build Release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: CoupleOS-release-apk
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 30
