# ─────────────────────────────────────────────────────────────
#  GitHub  Actions — Build & Release APK  (debug + signed release)
#  Repo  : aftereditchannel-cell/LOVE
#  Branch: arena/01a02144-love
#  Stack : Kotlin 1.9 · AGP 8.5 · Gradle 8.7 · Compose · Hilt · Room
# ─────────────────────────────────────────────────────────────

name: "🔨 Build APK"

on:
  # ── هر push روی برنچ خودت ─────────────────────────────────
  push:
    branches: [ "arena/01a02144-love" ]
  # ── دکمه دستی از تب Actions ──────────────────────────────
  workflow_dispatch:
    inputs:
      build_type:
        description: "نوع بیلد"
        required: true
        default: "debug"
        type: choice
        options:
          - debug
          - release

# ── سطح دسترسی برای آپلود آرتیفکت ────────────────────────
permissions:
  contents: read

jobs:
  # ╔═══════════════════════════════════════════════════════════╗
  # ║  1) BUILD DEBUG APK  (همیشه اجرا میشه)                   ║
  # ╚═══════════════════════════════════════════════════════════╝
  build-debug:
    name: "🐛 Debug APK"
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.build_type == 'debug')

    steps:
      # ── 1. چک‌اوت کد ──────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── 2. نصب JDK 17 ─────────────────────────────────────
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # ── 3. کش Gradle برای سرعت بیشتر ──────────────────────
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      # ── 4. بیلد Debug APK ──────────────────────────────────
      - name: Build Debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      # ── 5. آپلود APK به عنوان آرتیفکت ─────────────────────
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: CoupleOS-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 14

  # ╔═══════════════════════════════════════════════════════════╗
  # ║  2) BUILD SIGNED RELEASE APK  (فقط دستی)                 ║
  # ╚═══════════════════════════════════════════════════════════╝
  build-release:
    name: "🚀 Signed Release APK"
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.event.inputs.build_type == 'release'

    steps:
      # ── 1. چک‌اوت ─────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── 2. JDK ────────────────────────────────────────────
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # ── 3. کش ─────────────────────────────────────────────
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      # ── 4. ساخت Keystore از Secrets ───────────────────────
      - name: Decode Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/release.keystore

      # ── 5. ساخت keystore.properties ───────────────────────
      - name: Create keystore.properties
        run: |
          cat > android/keystore.properties <<EOF
          storeFile=release.keystore
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          EOF

      # ── 6. بیلد Release APK (minify + shrink فعاله) ───────
      - name: Build Release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      # ── 7. آپلود APK ──────────────────────────────────────
      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: CoupleOS-release-apk
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 30
